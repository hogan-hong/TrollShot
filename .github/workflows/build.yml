name: 构建 TrollShot

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install ldid-procursus p7zip make dpkg

      - name: 检出 Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: 安装 iOS SDK
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          mkdir -p $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk $THEOS/sdks/
          cp -R /tmp/theos-sdks/iPhoneOS14.5.sdk $THEOS/sdks/
          ls -la $THEOS/sdks/

      - name: 构建 deb（越狱版：framebuffer 直读，单线程）
        run: |
          set -o pipefail
          export THEOS=$GITHUB_WORKSPACE/theos
          rm -rf .theos
          make clean package FLAVOR=deb 2>&1 | tee build.log

          echo "=== 检查 staging .app 中的 daemon ==="
          ls -la .theos/_/Applications/TrollShot.app/ || true

          echo "=== 验证 plist 路径 ==="
          plutil -p .theos/_/Library/LaunchDaemons/com.hogan.trollshot.plist || cat .theos/_/Library/LaunchDaemons/com.hogan.trollshot.plist || true

          echo "=== 检查 .deb 中的关键文件 ==="
          dpkg-deb -c packages/com.hoganhong.trollshot_*.deb | grep -E "trollshotd|\.plist|postinst|prerm" || true

          echo "=== 修改 Architecture 为 iphoneos-arm (rootful 格式) ==="
          sed -i '' 's/Architecture: iphoneos-arm64/Architecture: iphoneos-arm/' .theos/_/DEBIAN/control
          cat .theos/_/DEBIAN/control

          echo "=== 用 gzip 压缩重建 deb (rootful 兼容) ==="
          rm -f packages/*.deb
          dpkg-deb -Zgzip -b .theos/_ packages/com.hoganhong.trollshot_1.0.0_iphoneos-arm.deb
          echo "=== 重建后的 deb 信息 ==="
          dpkg-deb -I packages/com.hoganhong.trollshot_1.0.0_iphoneos-arm.deb
          dpkg-deb -c packages/com.hoganhong.trollshot_1.0.0_iphoneos-arm.deb | grep -E "trollshotd|\.plist|postinst|prerm"
          echo "=== 验证 DEBIAN 脚本 ==="
          dpkg-deb --info packages/com.hoganhong.trollshot_1.0.0_iphoneos-arm.deb || true

          echo "=== 转存 deb 产物（后续 ipa 构建会清理 packages 目录） ==="
          mkdir -p artifacts
          cp -p packages/*.deb artifacts/

      - name: 构建 ipa（非越狱版：CARenderServer，4 线程）
        run: |
          set -o pipefail
          export THEOS=$GITHUB_WORKSPACE/theos
          rm -rf .theos packages
          make clean package FLAVOR=ipa 2>&1 | tee -a build.log

          echo "=== ipa 版 staging 检查（不应含 LaunchDaemons/DEBIAN/usr/bin） ==="
          ls -la .theos/_/Applications/TrollShot.app/ || true
          if [ -d ".theos/_/Library/LaunchDaemons" ] || [ -d ".theos/_/usr/bin" ]; then
            echo "❌ ipa 构建不应包含 deb 布局文件（LaunchDaemons/usr/bin）！"
            exit 1
          fi

          set -e
          # 验证 staging .app 中包含 Info.plist
          if [ ! -f ".theos/_/Applications/TrollShot.app/Info.plist" ]; then
            echo "❌ Info.plist 不在 .app bundle 中！手动复制..."
            cp -p Info.plist ".theos/_/Applications/TrollShot.app/Info.plist"
          fi
          # 从 staging 目录拿出 .app，按 TrollStore 标准打包成 Payload/*.app
          mkdir -p Payload
          cp -R .theos/_/Applications/TrollShot.app Payload/
          # 验证 Info.plist 已复制
          if [ ! -f "Payload/TrollShot.app/Info.plist" ]; then
            echo "❌ Payload/TrollShot.app/Info.plist 仍缺失！"
            exit 1
          fi
          echo "✅ Info.plist 验证通过"
          # TrollStore 安装时需要可执行权限
          chmod -R +x Payload/TrollShot.app
          zip -yqr TrollShot.ipa Payload
          rm -rf Payload
          ls -lh TrollShot.ipa
          # 列出 IPA 内容确认结构
          echo "=== IPA 内容 ==="
          python3 -c "import zipfile; [print(n) for n in zipfile.ZipFile('TrollShot.ipa').namelist()]"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 上传 IPA 构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrollShot-ipa
          path: TrollShot.ipa
          if-no-files-found: error

      - name: 上传 deb 越狱包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrollShot-deb
          path: artifacts/*.deb
          if-no-files-found: error

      - name: 上传解包调试信息
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-debug
          path: .theos/_
          if-no-files-found: ignore
